<!DOCTYPE html>
<html>
<head>
  <title>AI Text Analyzer</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
    }
    textarea {
      width: 100%;
      height: 120px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <h2>AI Text Analyzer</h2>
  <p>Enter a customer review or application feedback below to analyze sentiment and key phrases.</p>

  <textarea id="inputText" placeholder="Example: The application works good but crashes during payment processing"></textarea>
  <br>
  <button onclick="analyzeText()">Analyze</button>

  <div class="result" id="result"></div>

<script>
async function analyzeText() {
  const text = document.getElementById("inputText").value;
  const resultDiv = document.getElementById("result");

  if (!text.trim()) {
    resultDiv.innerHTML = "⚠️ Please enter some text.";
    return;
  }

  resultDiv.innerHTML = "Analyzing... ⏳";

  try {
    const response = await fetch(
      "https://9h878f5dx6.execute-api.us-east-1.amazonaws.com/prod/analyze",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: text })
      }
    );

    // 🔴 THIS LINE WAS MISSING OR BROKEN
    const data = await response.json();

    resultDiv.innerHTML = `
      <b>Sentiment:</b> ${data.sentiment}<br><br>
      <b>Key Phrases:</b><br>
      ${data.key_phrases.map(k => "• " + k).join("<br>")}
    `;

  } catch (err) {
    console.error("Frontend error:", err);
    resultDiv.innerHTML = "Error: " + err.message;
  }
}
</script>




</body>
</html>
